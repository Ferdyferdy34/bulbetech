<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Bulbe Tech — gestion de boutique de réparation téléphone et ordinateur." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cloud.css" />
  <title>Bulbe Tech — Gestion réparation</title>
</head>
<body>
  <div id="authGate" class="auth-gate hidden">
    <div class="auth-card">
      <div class="brand-mark">BT</div>
      <h1>Bulbe Tech</h1><p class="auth-subtitle">Connexion administrateur</p>
      <div id="authModeLogin">
        <form id="loginForm">
          <label>Email<input type="email" name="email" required autocomplete="email"></label>
          <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
          <button class="btn btn-primary" type="submit">Se connecter</button>
          <button class="link-btn" type="button" id="showSignup">Créer un compte administrateur</button>
        </form>
      </div>
      <div id="authModeSignup" class="hidden">
        <form id="signupForm">
          <label>Email<input type="email" name="email" required autocomplete="email"></label>
          <label>Mot de passe<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
          <button class="btn btn-primary" type="submit">Créer le compte</button>
          <button class="link-btn" type="button" id="showLogin">Retour à la connexion</button>
        </form>
      </div>
      <div id="authMessage" class="auth-message"></div>
      <div class="footer-note">Mode local disponible si Supabase n’est pas configuré.</div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">BT</div>
        <div><strong>Bulbe Tech</strong><span>Réparation & gestion</span></div>
      </div>
      <nav class="nav" aria-label="Navigation principale">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Tableau de bord</span></button>
        <button class="nav-item" data-view="repairs">🛠 <span>Réparations</span></button>
        <button class="nav-item" data-view="inventory">📦 <span>Stock & achats</span></button>
        <button class="nav-item" data-view="clients">👥 <span>Clients</span></button>
        <button class="nav-item" data-view="finance">💰 <span>Chiffre d'affaires</span></button>
        <button class="nav-item" data-view="stats">📈 <span>Statistiques</span></button>
        <button class="nav-item" data-view="followups">💬 <span>Relances WhatsApp</span></button>
        <button class="nav-item" data-view="backup">↕ <span>Sauvegarde</span></button>
        <button class="nav-item install-nav" id="installAppBtn" type="button">📲 <span>Installer l’application</span></button>
      </nav>
      <div class="sidebar-footer"><span id="connectionStatus">● En ligne</span><br>PWA • hors connexion</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Ouvrir le menu">☰</button>
        <div>
          <div class="eyebrow">GESTION MENSUELLE</div>
          <h1 id="pageTitle">Tableau de bord</h1>
        </div>
        <div class="top-actions">
          <label class="month-picker">Mois <input type="month" id="monthFilter" /></label>
          <button class="btn btn-primary" id="quickRepair">+ Nouvelle réparation</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-repairs" class="view"></section>
      <section id="view-inventory" class="view"></section>
      <section id="view-clients" class="view"></section>
      <section id="view-finance" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-followups" class="view"></section>
      <section id="view-backup" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
  </script>
</body>
</html>
